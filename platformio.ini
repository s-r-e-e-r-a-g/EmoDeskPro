; EmoDesk 2 - PlatformIO project (pioarduino = Arduino-ESP32 core 3.x)
[platformio]
src_dir = EmoDesk
default_envs = esp32c3_supermini

[env:esp32c3_supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = EmoDesk/partitions.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio
board_upload.flash_size = 4MB
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:tools/pio_build_web.py
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  olikraus/U8g2
  bblanchon/ArduinoJson@^7.4
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
